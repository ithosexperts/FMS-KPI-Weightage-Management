services:
  - type: web
    name: fms-kpi-weightage-management
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: APP_NAME
        value: "FMS KPI Weightage Management"
      - key: API_BASE_URL
        value: "https://api.hosexperts.com:85/apiv3.php"
      - key: API_TEST_URL
        value: "https://api.hosexperts.com:85/apiv2.php"
      - key: API_DATABASE
        value: "OperationsDB"
      - key: API_AUTH_TOKEN
        value: "Khushbu*#*#123"
      - key: API_TIMEOUT
        value: "60.0"
      - key: DEFAULT_USER_CODE
        value: "0210"
      - key: DEFAULT_USER_NAME
        value: "Himanshu Sehgal"
      - key: DEFAULT_ROLE_ID
        value: "1"
